<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag Day</title>
<style>
:root{--bg:#eaf2f1;--surface:#fff;--ink:#10302f;--mute:#4d6b69;--line:#c9dcda;--accent:#1d5fa8;--accent-ink:#fff;--ok:#1e7b4b;--okbg:#dff3e7;--bad:#b3372f;--badbg:#fbe4e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e22;--surface:#172b30;--ink:#e6f0ee;--mute:#9bb5b2;--line:#2a444a;--accent:#6fb0ee;--accent-ink:#0f1e22;--ok:#6fd39a;--okbg:#17382a;--bad:#ff9a90;--badbg:#3d1f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1e22;--surface:#172b30;--ink:#e6f0ee;--mute:#9bb5b2;--line:#2a444a;--accent:#6fb0ee;--accent-ink:#0f1e22;--ok:#6fd39a;--okbg:#17382a;--bad:#ff9a90;--badbg:#3d1f1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 22px/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.qn{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:3px 12px;border-radius:99px;margin-bottom:14px}
.qt{font:600 21px/1.35 Georgia,"Iowan Old Style",serif;margin:0 0 18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.res{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.foot{margin-top:18px;color:var(--mute);font-size:14px}
a{color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.bar input{flex:1;min-width:200px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.bar button{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;break-inside:avoid}
.qr .box{background:#fff;display:inline-block;padding:8px;border-radius:6px;line-height:0}
.qr p{margin:8px 0 0;font-weight:600}
.qr small{display:block;color:var(--mute);font-weight:400}
@media print{.bar,.sub{display:none}body{background:#fff;color:#000}.qr{border-color:#999}}
.who{font-weight:600;margin:0 0 12px}
.btn{display:block;width:100%;font:inherit;font-weight:600;padding:13px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:14px}
.nm{width:100%;font:inherit;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.one{text-align:center}.one .box{background:#fff;display:inline-block;padding:14px;border-radius:8px;line-height:0}
@media print{.btn,.foot{display:none}}
.lg{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:center;line-height:0}.lg img{width:min(300px,100%);height:auto}
</style>
</head>

var app=document.getElementById("app"),name="",i=0,score=0,L="ABCD";
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function start(){
  app.innerHTML="";
  app.appendChild(el("h1",0,"Flag Day"));
  app.appendChild(el("p","sub","Enter your name, then answer the questions one by one. | اكتب اسمك وجاوب على الأسئلة"));
  var c=el("div","card"),inp=el("input","nm");inp.placeholder="Your name | اسمك";inp.value=name;inp.maxLength=40;
  var go=el("button","btn","Start | ابدأ");
  function run(){var v=inp.value.trim();if(!v){inp.focus();return}name=v;i=0;score=0;ask()}
  go.onclick=run;inp.onkeydown=function(e){if(e.key==="Enter")run()};
  c.appendChild(inp);c.appendChild(go);app.appendChild(c);
  var f=el("p","foot"),a=el("a",0,"Show QR code to print | عرض رمز QR");a.href="#";a.onclick=function(e){e.preventDefault();qr()};
  f.appendChild(a);app.appendChild(f);
}
function ask(){
  var d=Q[i],done=false,btns=[];
  app.innerHTML="";
  app.appendChild(el("p","who","👤 "+name));
  var card=el("div","card");
  card.appendChild(el("span","qn","Question "+(i+1)+" of "+Q.length));
  card.appendChild(el("p","qt",d.q));
  var res=el("div"),nx=el("button","btn",i<Q.length-1?"Next question | السؤال التالي":"Finish | إنهاء");nx.style.display="none";
  nx.onclick=function(){i++;i<Q.length?ask():finish()};
  d.o.forEach(function(t,k){
    var b=el("button","opt");b.appendChild(el("b",0,L[k]));b.appendChild(el("span",0,t));
    b.onclick=function(){
      if(done)return;done=true;
      btns.forEach(function(x,j){x.disabled=true;if(j===d.a)x.classList.add("ok")});
      var right=k===d.a;if(right)score++;else b.classList.add("bad");
      res.className="res "+(right?"ok":"bad");
      res.textContent=right?"Correct! Well done.":"Not quite. The correct answer is "+L[d.a]+": "+d.o[d.a]+".";
      nx.style.display="block";nx.focus();
    };
    btns.push(b);card.appendChild(b);
  });
  card.appendChild(res);card.appendChild(nx);app.appendChild(card);window.scrollTo(0,0);
}
function finish(){
  app.innerHTML="";
  app.appendChild(el("p","who","👤 "+name));
  var c=el("div","card");
  c.appendChild(el("h1",0,"Well done, "+name+"!"));
  c.appendChild(el("p","qt","You scored "+score+" out of "+Q.length+"."));
  var b=el("button","btn","Start over | ابدأ من جديد");b.onclick=function(){name="";start()};
  c.appendChild(b);app.appendChild(c);
}
function qr(){
  app.innerHTML="";
  app.appendChild(el("h1",0,"Flag Day"));
  app.appendChild(el("p","sub","One code for the whole quiz. Print it and place it where staff can scan."));
  var base=location.href.split("#")[0].split("?")[0];
  var bar=el("div","bar"),inp=el("input");inp.value=base;inp.setAttribute("aria-label","Quiz page link");
  var up=el("button",0,"Update code"),pr=el("button",0,"Print");pr.onclick=function(){window.print()};
  bar.appendChild(inp);bar.appendChild(up);bar.appendChild(pr);app.appendChild(bar);
  var one=el("div","one");app.appendChild(one);
  function build(){
    one.innerHTML="";var box=el("div","box");one.appendChild(box);
    try{new QRCode(box,{text:inp.value.trim(),width:240,height:240,correctLevel:QRCode.CorrectLevel.M})}catch(e){box.textContent="QR failed to load"}
  }
  up.onclick=build;build();
  var f=el("p","foot"),a=el("a",0,"Back | رجوع");a.href="#";a.onclick=function(e){e.preventDefault();start()};
  f.appendChild(a);app.appendChild(f);
}
start();
</script>
